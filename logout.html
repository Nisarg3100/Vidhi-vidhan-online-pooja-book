<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout Confirmation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4a6bff;
            --danger-color: #ff4757;
            --secondary-color: #6c757d;
            --dark-color: #343a40;
            --light-color: #f8f9fa;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--light-color);
            color: var(--dark-color);
            line-height: 1.6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .logout-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            text-align: center;
            padding: 2.5rem;
        }
        
        .logout-icon {
            font-size: 3.5rem;
            color: var(--danger-color);
            margin-bottom: 1.5rem;
            display: inline-block;
        }
        
        .logout-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--dark-color);
        }
        
        .logout-message {
            color: var(--secondary-color);
            margin-bottom: 2rem;
            font-size: 1rem;
        }
        
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn-logout {
            background-color: var(--danger-color);
            color: white;
        }
        
        .btn-logout:hover {
            background-color: #ff2d42;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.25);
        }
        
        .btn-cancel {
            background-color: white;
            color: var(--secondary-color);
            border: 1px solid #dee2e6;
        }
        
        .btn-cancel:hover {
            background-color: #f1f3f5;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(108, 117, 125, 0.1);
        }
        
        @media (max-width: 576px) {
            .logout-card {
                padding: 1.5rem;
            }
            
            .btn-group {
                flex-direction: column;
                gap: 0.75rem;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="logout-card">
        <div class="logout-icon">
            <i class="bi bi-box-arrow-right"></i>
        </div>
        <h1 class="logout-title">Ready to leave?</h1>
        <p class="logout-message">
            You're about to sign out of your account. 
            Make sure to save any unsaved changes before logging out.
        </p>
        
        <div class="btn-group">
            <button id="cancel-btn" class="btn btn-cancel">
                <i class="bi bi-arrow-left"></i> Cancel
            </button>
            <button id="logout-btn" class="btn btn-logout">
                Logout <i class="bi bi-box-arrow-right"></i>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const logoutBtn = document.getElementById('logout-btn');
            const cancelBtn = document.getElementById('cancel-btn');
            
            // Logout button handler
            logoutBtn.addEventListener('click', function() {
                // In a real application, you would make an API call here
                // For demonstration, we'll simulate a logout
                this.disabled = true;
                this.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Logging out...';
                
                setTimeout(() => {
                    alert('You have been successfully logged out.');
                    window.location.href = 'login.html';
                }, 1500);
            });
            
            // Cancel button handler
            cancelBtn.addEventListener('click', function() {
                // Go back to previous page or home
                window.history.back() || (window.location.href = 'index.html');
            });
            
            // Add keyboard support
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    cancelBtn.click();
                } else if (e.key === 'Enter') {
                    logoutBtn.click();
                }
            });
        });
    </script>
</body>
</html>
